bio: |
  bio: |
  I am an Assistant Professor of Mathematics at the National Institute of Technology Rourkela. I work on the mathematical foundations of machine learning, designing efficient and stable training algorithms for randomized neural networks using tools from numerical linear algebra, Probability, and optimization. My current interest is explainable AI (XAI), using mathematical structure to make model behaviour transparent. 

